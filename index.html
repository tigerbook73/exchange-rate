<!doctype html>
<html lang="zh-CN" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Run before application JS/CSS so the initial canvas matches next-themes.
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("theme") || theme;
        } catch {
          // System theme still works when storage is unavailable.
        }
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        background-color: #ffffff;
      }
      :root.dark {
        color-scheme: dark;
        background-color: #0a0a0a;
      }
    </style>
    <meta name="application-name" content="澳币购汇价" />
    <title>工商银行澳币购汇价</title>
    <meta
      name="description"
      content="工商银行澳大利亚元现汇卖出价（购汇价）当日报价与历史趋势"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a0a0a"
    />
    <meta name="apple-mobile-web-app-title" content="澳币购汇价" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
